[project]
name = "wdvi"
version = "0.1.0"
description = "WastedDailyVI – automatische Pipeline für virale GTA-6-Clips (Discover → Claude-Edit → Render → Review → Post)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "sqlmodel>=0.0.21",
    "httpx>=0.27",
    "curl_cffi>=0.7",
    "feedparser>=6",
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1",
    "opencv-python-headless>=4.9,<5",
    "numpy>=1.26",
    "pillow>=10.3",
    "imagehash>=4.3",
    "cairosvg>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10,<4",
    "typer>=0.12",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
# Musik-Erkennung (AudioSet-Tagger). Schwer (torch), daher optional – im Docker-Image enthalten.
music = ["torch>=2.3", "transformers>=4.44"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
wdvi = "wdvi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wdvi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: rendert echte Videos mit ffmpeg (mehrere Sekunden)",
    "network: braucht Internet / echte APIs (standardmäßig übersprungen)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
